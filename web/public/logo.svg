<svg width="512" height="512" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --logo-black: #0A0A0A;
      --logo-white: #FFFFFF;
      --logo-neutral-700: #2B2B2B;
      --logo-neutral-300: #D9D9D9;
      --logo-bg: var(--logo-black);
      --logo-glyph: var(--logo-white);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --logo-bg: var(--logo-white);
        --logo-glyph: var(--logo-black);
      }
    }
  </style>
  <rect width="128" height="128" rx="28" fill="var(--logo-bg)" />
  <path d="M81.22 36.97 A19 19 0 1 0 49.45 57.21" stroke="var(--logo-glyph)" stroke-width="13" stroke-linecap="round" />
  <path d="M81.22 36.97 A19 19 0 1 0 49.45 57.21" stroke="var(--logo-glyph)" stroke-width="13" stroke-linecap="round" transform="rotate(180 64 64)" />
  <circle cx="64" cy="64" r="6" fill="var(--logo-glyph)" />
</svg>
